# Makes the engine installable (pip / uv) so the Anascope Desktop can install it without a checkout or a compiler.
# Phase A of docs/ml-engine-packaging.md (in training-manager): the packages keep their current top-level names (src, utils, config, data) so no import changes.
# The native library is built beforehand by build_native.sh and copied into utils/bin/ (see .github/workflows/wheel.yml); this file only packages what is already built.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-engine"
version = "0.2.0"
description = "Neural network training engine (NumPy/Numba with native C++ kernels)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.14.0",
    "numba>=0.59.0",
    "pandas>=2.1.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "threadpoolctl>=3.4.0",
]

[tool.setuptools.packages.find]
include = ["src*", "utils*", "config*", "data*"]
exclude = ["data.shards*"]
namespaces = true

[tool.setuptools]
py-modules = ["run_pipeline"]      # the fit launcher runs `python run_pipeline.py` from the engine root (src/launcher/runner.py)

[tool.setuptools.package-data]
utils = ["bin/*.so", "bin/*.dll"]
config = ["*.yaml"]
