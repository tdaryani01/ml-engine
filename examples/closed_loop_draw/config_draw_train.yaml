# examples/closed_loop_draw/config_draw_train.yaml
# Train the closed-loop draw demo (app layer; not TrainingSession).
meta:
  pipeline_name: closed_loop_draw_train
  output_dir: diagnostics_output/closed_loop_draw

closed_loop:
  max_steps: 4
  batch_size: 8
  canvas: [1, 28, 28]   # C, H, W
  num_commands: 6       # circle, line, square, cross, ring, sketch
  command_id: 0
  sigma: 0.08
  terminal_loss: true
  target:
    kind: stock

mhsa:
  d_model: 64
  num_heads: 4
  action_dim: 4
  ffn_mult: 2
  num_layers: 2
  use_pos_encoding: false
  use_input_proj: false

cnn_encoder:
  input_shape: [1, 28, 28]
  feature_dim: 32
  dense_head: []

optimization:
  learning_rate: 0.001
  trajectories: 100
  log_every: 10
  dump_every: 50
  seed: 0
