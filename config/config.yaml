# =====================================================================
# SYSTEM META CONFIGURATION
# =====================================================================
meta:
  pipeline_name: "industrial_risk_unconstrained_run"
  stage: "development"
  suppress_logging: false
  logging_level: "info"
  output_dir: "diagnostics_output"

# =====================================================================
# DATA INGESTION MATRIX
# =====================================================================
ingestion:
  source_mode: "csv"                   # Options: "csv" or "stream"
  data_file_path: ".\\data\\generator\\supply_chain.csv"
  feature_names:
    - "Supplier_Lead_Time"
    - "Logistics_Delay_Index"
    - "Resource_Reserve_Percent"
    - "Labor_Capacity_Utilization"
    - "Macro_Inflation_Rate"
  splits:
    train: 0.70
    val: 0.15
  # amqp_url: "amqp://guest:guest@localhost:5672/%2f" # Staged for Option 1
  # queue_name: "supply_chain.incoming_batches"        # Staged for Option 1

# =====================================================================
# NETWORK ARCHITECTURE CONFIGURATION
# =====================================================================
architecture:
  model_type: "multi_class"
  hidden_layers: [128, 64]
  p_dropout: 0.0                       # Dropped to 0 to unlock maximum representation capacity
  use_batch_norm: false                # Disabled: Stop shifting boundaries on crisp tabular formulas
  bn_momentum: 0.9

# =====================================================================
# OPTIMIZATION LOOP CONTROLS
# =====================================================================
optimization:
  optimizer: "adam"
  epochs: 300
  batch_size: 64
  learning_rate: 0.0001                # Reset to standard 0.001 for stable convergence if needed
  
  # Learning Rate Schedule
  lr_scheduler: "none"
  scheduler_drop_ratio: 0.5
  scheduler_epochs_per_drop: 50        # Widened drop window to give Adam time to aggressively minimize loss
  scheduler_decay_rate: 0.98

  # Early Stopping Monitor
  early_stopping_enabled: true
  patience: 40                         # Extended patience to give the unconstrained network room to learn
  min_delta: 1.0e-05

  # Numerical Defensive Guardrails
  gradient_clipping_max_norm: 5.0

# =====================================================================
# REGULARIZATION STRAIN MATRIX
# =====================================================================
regularization:
  lam_l1: 0
  lam_l2: 0                            # Stripped out L2 penalty to let weights map non-linear curves freely
  sparsity_tolerance: 1.0e-05          # Moved out of training block into its natural mathematical home

# =====================================================================
# PIPELINE FEATURE TRANSLATION TRANSFORMATIONS
# =====================================================================
transformations:
  fourier_expansion:
    enabled: false
    num_frequencies: 4

# =====================================================================
# PERSISTENCE & LIFECYCLE MANAGEMENT
# =====================================================================
persistence:
  load_saved_model: false
  model_asset_path: "deployed_model.npz"

# =====================================================================
# DIAGNOSTICS & REPORTING
# =====================================================================
diagnostics:
  enabled: true
  metric_to_plot: "all"