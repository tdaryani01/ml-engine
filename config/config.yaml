environment:
  stage: development
  data_file: .\data\generator\chaotic_oscillator.csv
  output_dir: diagnostics_output
  model_asset_path: deployed_model.npz
  load_saved_model: false
data:
  feature_names:
  - Time
  - Radius
  - Angle
  train_split: 0.6
  val_split: 0.2
architecture:
  use_batch_norm: false
  bn_momentum: 0.9
  model_type: regression
  hidden_layers: [217, 210, 316]
  p_dropout: 0.0
training:
  optimizer: adam
  epochs: 400
  batch_size: 32
  learning_rate: 0.0006377024100266827
  sparsity_tolerance: 1.0e-05
  bn_momentum: 0.9
  fourier_expansion:
    enabled: false
    num_frequencies: 4
  lr_scheduler: none
  scheduler_decay_rate: 0.995
  scheduler_drop_ratio: 0.2
  scheduler_epochs_per_drop: 40
  early_stopping_enabled: true
  patience: 140
  min_delta: 1.938234878433713e-05
regularization:
  lam_l1: 0
  lam_l2: 2.953279201734388e-05
diagnostics:
  enabled: true
  metric_to_plot: all
pipeline:
  name: spiral_tuning_run
  suppress_logging: false
  logging_level: INFO
