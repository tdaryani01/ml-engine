<?xml version="1.0" standalone="yes"?>

<event_configuration family="19" modellow="50" modelhigh="5f" version="2">
    <!-- Specify a Eventgroup and Each eventgroup can be of type "core" or "l3" or "df"
            1. 4 fixed perf events
            2. 6 Core PMC events or 6 L3 PMC events or 4 DF events
            3. Metrics that can be computed
            4. If a Metric name starts with "$" that will be considered as intermediate result which
               will be used in subsequent metrics and hence this will not be printed.
    -->

    <!-- Core PMC Event groups -->
    <core subtype="ipc">
        <event ctl="ff00" name="$TSC"> </event>
        <event ctl="ff02" name="$APerf" aperf="T"> </event>
        <event ctl="ff03" name="$MPerf" mperf="T"> </event>

        <event ctl="0x410076" name="$CpuCyclesUser"> </event>
        <event ctl="0x4100C0" name="$RetdInstUser"> </event>
        <event ctl="0x420076" name="$CpuCyclesKernel"> </event>
        <event ctl="0x4200C0" name="$RetdInstKernel"> </event>
    </core>

    <core subtype="ipc">
        <event ctl="0x4300C2" name="$RetdBrInst"> </event>
        <event ctl="0x4300C3" name="$RetdBrInstMispred"> </event>
        <event ctl="0x430125" name="$RetdLockInst"> </event>
        <event ctl="0x4300C0" name="$RetdInst2"> </event>

        <metric name="$ElapsedTimeinUsIpc" expression="$TSC / $P0Freq" elapsedTime="T"> </metric>
        <metric name="$ElapsedTscUtil" expression="$TSC" elapsedTscUtil="T"> </metric>

        <metric name="$RetdInst" expression="($RetdInstUser + $RetdInstKernel)"> </metric>
        <metric name="$CpuCycles" expression="($CpuCyclesUser + $CpuCyclesKernel)"> </metric>

        <metric name="Utilization (%)" expression="$MPerf * 100 / $ElapsedTscUtil" mperf="T"> </metric>
        <metric name="System time (%)" expression="$CpuCyclesKernel * 100 / $APerf" aperf="T"> </metric>
        <metric name="User time (%)" expression="$CpuCyclesUser * 100 / $APerf" aperf="T"> </metric>
        <metric name="System instructions (%)" expression="$RetdInstKernel * 100 / $RetdInst"> </metric>
        <metric name="User instructions (%)" expression="$RetdInstUser * 100 / $RetdInst"> </metric>
        <metric name="Eff Freq (MHz)" expression="($APerf / $MPerf) * $P0Freq" aperf="T" mperf="T"> </metric>
        <metric name="IPC (Sys + User)" expression="$RetdInst / $CpuCycles"> </metric>
        <metric name="IPC (Sys)" expression="$RetdInstKernel / $CpuCyclesKernel"> </metric>
        <metric name="IPC (User)" expression="$RetdInstUser / $CpuCyclesUser"> </metric>
        <metric name="CPI (Sys + User)" expression="$CpuCycles / $RetdInst"> </metric>
        <metric name="CPI (Sys)" expression="$CpuCyclesKernel / $RetdInstKernel"> </metric>
        <metric name="CPI (User)" expression="$CpuCyclesUser / $RetdInstUser"> </metric>
        <metric name="Giga Instructions Per Sec" expression="$RetdInst / ($ElapsedTimeinUsIpc * 1000)"> </metric>
        <metric name="Locked Instructions (pti)" expression="($RetdLockInst * 1000) / $RetdInst2"> </metric>
        <metric name="Retired Branches (pti)" expression="($RetdBrInst / $RetdInst2) * 1000"> </metric>
        <metric name="Retired Branches Mispredicted (pti)" expression="($RetdBrInstMispred / $RetdInst2) * 1000"> </metric>
    </core>

    <core subtype="fp">
        <event ctl="ff00" name="$TscFP"> </event>

        <event ctl="0x430F03" name="$RetdSseAvxFlops"> </event>
        <event ctl="0xf004300ff" name="$RetdSseAvxFlopsMerge"> </event>
        <event ctl="0x430E0E" name="$MixedSSEAVXStalls"> </event>
        <event ctl="0x4300C0" name="$IRPerfFP"> </event>

        <metric name="$ElapsedTimeinUsFp" expression="$TscFP / $P0Freq" elapsedTime="T"> </metric>

        <metric name="Retired SSE/AVX Flops(GFLOPs)" expression="$RetdSseAvxFlops / ($ElapsedTimeinUsFp * 1000.0)"> </metric>
        <metric name="Mixed SSE/AVX Stalls (pti)" expression="($MixedSSEAVXStalls * 1000) / $IRPerfFP"> </metric>
    </core>

    <core subtype="l1">
        <event ctl="0x4300C0" name="$IRPerfL1"> </event>
        <event ctl="0x430129" name="$DCAccess"> </event>
        <event ctl="0x430229" name="$DCAccess2"> </event>
        <event ctl="0x430429" name="$DCAccess3"> </event>
    </core>

    <core subtype="l1">
        <event ctl="0x4300C0" name="$IRPerfL12"> </event>
        <event ctl="0x100431F8E" name="$ICAccess"> </event>
        <event ctl="0x10043188E" name="$ICMiss"> </event>
        <event ctl="0x20043048F" name="$OpCacheMiss"> </event>
        <event ctl="0x20043078F" name="$OpCacheAccess"> </event>

        <metric name="IC (32B) Fetch Miss Ratio" expression="($ICMiss / $ICAccess)"> </metric>
        <metric name="Op Cache (64B) Fetch Miss Ratio" expression="($OpCacheMiss / $OpCacheAccess)"> </metric>

        <metric name="IC Access (pti)" expression="$ICAccess * 1000 / $IRPerfL12"> </metric>
        <metric name="IC Miss (pti)" expression="$ICMiss * 1000 / $IRPerfL12"> </metric>
        <metric name="DC Access (pti)" expression="(($DCAccess + $DCAccess2 + $DCAccess3) * 1000) / $IRPerfL1"> </metric>
    </core>

    <core subtype="dc">
      <event ctl="0x4300C0" name="$IRPerfDC"> </event>
      <event ctl="0x430144" name="$DCFillsFromL2"> </event>
      <event ctl="0x430244" name="$DCFillsFromL3orDiffL2"> </event> <!-- L3 or different L2 in same CCX -->
      <event ctl="0x430844" name="$DCFillsFromLocalMemory"> </event>

      <metric name="$AllDCFills" expression="($DCFillsFromL2 + $DCFillsFromL3orDiffL2 + $DCFillsFromLocalMemory)"> </metric>
      <metric name="DC Fills From L2 (pti)" expression="$DCFillsFromL2 * 1000 / $IRPerfDC"> </metric>
      <metric name="DC Fills From L3 or different L2 (pti)" expression="$DCFillsFromL3orDiffL2 * 1000 / $IRPerfDC"> </metric>
      <metric name="DC Fills From Local Memory (pti)" expression="$DCFillsFromLocalMemory * 1000 / $IRPerfDC"> </metric>
    </core>

    <core subtype="swpfdc">
      <event ctl="0x4300C0" name="$IRPerfSwDc"> </event>
      <event ctl="0x434059" name="$SwPfDcFillsFromDRAMOrIORemoteNode"> </event>
      <event ctl="0x431059" name="$SwPfDcFillsFromCacheInAnotherCCXRemoteNode"> </event>
      <event ctl="0x430859" name="$SwPfDcFillsFromDRAMOrIOLocalNode"> </event>
    </core>

    <core subtype="swpfdc">
      <event ctl="0x4300C0" name="$IRPerfSwDc2"> </event>
      <event ctl="0x430459" name="$SwPfDcFillsFromCacheInAnotherCCXLocalNode"> </event>
      <event ctl="0x430259" name="$SwPfDcFillsFromL3OrAnotherL2InSameCCX"> </event>
      <event ctl="0x430159" name="$SwPfDcFillsFromLocalL2"> </event>

      <metric name="SwPf DC Fills From DRAM or IO connected in remote node (pti)" expression="$SwPfDcFillsFromDRAMOrIORemoteNode * 1000 / $IRPerfSwDc"> </metric>
      <metric name="SwPf DC Fills From CCX Cache in remote node (pti)" expression="$SwPfDcFillsFromCacheInAnotherCCXRemoteNode * 1000 / $IRPerfSwDc"> </metric>
      <metric name="SwPf DC Fills From DRAM or IO connected in local node (pti)" expression="$SwPfDcFillsFromDRAMOrIOLocalNode * 1000 / $IRPerfSwDc"> </metric>
      <metric name="SwPf DC Fills From Cache of another CCX in local node (pti)" expression="$SwPfDcFillsFromCacheInAnotherCCXLocalNode * 1000 / $IRPerfSwDc2"> </metric>
      <metric name="SwPf DC Fills From L3 or different L2 in same CCX (pti)" expression="$SwPfDcFillsFromL3OrAnotherL2InSameCCX * 1000 / $IRPerfSwDc2"> </metric>
      <metric name="SwPf DC Fills From L2 (pti)" expression="$SwPfDcFillsFromLocalL2 * 1000 / $IRPerfSwDc2"> </metric>
    </core>

    <core subtype="hwpfdc">
      <event ctl="0x4300C0" name="$IRPerfHwDc"> </event>
      <event ctl="0x43405a" name="$HwPfDcFillsFromDRAMOrIORemoteNode"> </event>
      <event ctl="0x43105a" name="$HwPfDcFillsFromCacheInAnotherCCXRemoteNode"> </event>
      <event ctl="0x43085a" name="$HwPfDcFillsFromDRAMOrIOLocalNode"> </event>
    </core>

    <core subtype="hwpfdc">
      <event ctl="0x4300C0" name="$IRPerfHwDc2"> </event>
      <event ctl="0x43045a" name="$HwPfDcFillsFromCacheInAnotherCCXLocalNode"> </event>
      <event ctl="0x43025a" name="$HwPfDcFillsFromL3OrAnotherL2InSameCCX"> </event>
      <event ctl="0x43015a" name="$HwPfDcFillsFromLocalL2"> </event>

      <metric name="HwPf DC Fills From DRAM or IO connected in remote node (pti)" expression="$HwPfDcFillsFromDRAMOrIORemoteNode * 1000 / $IRPerfHwDc"> </metric>
      <metric name="HwPf DC Fills From CCX Cache in remote node (pti)" expression="$HwPfDcFillsFromCacheInAnotherCCXRemoteNode * 1000 / $IRPerfHwDc"> </metric>
      <metric name="HwPf DC Fills From DRAM or IO connected in local node (pti)" expression="$HwPfDcFillsFromDRAMOrIOLocalNode * 1000 / $IRPerfHwDc"> </metric>
      <metric name="HwPf DC Fills From Cache of another CCX in local node (pti)" expression="$HwPfDcFillsFromCacheInAnotherCCXLocalNode * 1000 / $IRPerfHwDc2"> </metric>
      <metric name="HwPf DC Fills From L3 or different L2 in same CCX (pti)" expression="$HwPfDcFillsFromL3OrAnotherL2InSameCCX * 1000 / $IRPerfHwDc2"> </metric>
      <metric name="HwPf DC Fills From L2 (pti)" expression="$HwPfDcFillsFromLocalL2 * 1000 / $IRPerfHwDc2"> </metric>
    </core>

    <core subtype="l2">
        <event ctl="0x4300C0" name="$IRPerfL2"> </event>
        <event ctl="0x43F960" name="$L2AccessWithoutPF"> </event>
        <event ctl="0x431F70" name="$L2PFHitinL2"> </event>
        <event ctl="0x431F71" name="$L2PFMissL2HitinL3"> </event>
        <event ctl="0x431F72" name="$L2PFMissL2L3"> </event>

        <metric name="$L2PFMissinL2" expression="($L2PFMissL2HitinL3 + $L2PFMissL2L3)"> </metric>
    </core>

    <core subtype="l2">
        <event ctl="0x4300C0" name="$IRPerfL22"> </event>
        <event ctl="0x431060" name="$L2AccessFromICMiss"> </event>
        <event ctl="0x43E860" name="$L2AccessFromDCMiss"> </event>
        <event ctl="0x430164" name="$L2MissIC"> </event>
        <event ctl="0x430864" name="$L2MissDC"> </event>

        <metric name="$L2Miss" expression="$L2MissIC + $L2MissDC"> </metric>
    </core>

    <core subtype="l2">
        <event ctl="0x4300C0" name="$IRPerfL23"> </event>
        <event ctl="0x430664" name="$L2HitIC"> </event>
        <event ctl="0x43F064" name="$L2HitDC"> </event>
        <event ctl="0x43F664" name="$L2HitWithoutPF"> </event>

        <metric name="L2 Access (pti)" expression="(($L2AccessWithoutPF + $L2PFHitinL2 + $L2PFMissinL2) * 1000) / $IRPerfL2"> </metric>
        <metric name="L2 Access from IC Miss (pti)" expression="($L2AccessFromICMiss * 1000 / $IRPerfL22)"> </metric>
        <metric name="L2 Access from DC Miss (pti)" expression="($L2AccessFromDCMiss * 1000 / $IRPerfL22)"> </metric>
        <metric name="L2 Access from L2 HWPF (pti)" expression="(($L2PFHitinL2 + $L2PFMissinL2) * 1000) / $IRPerfL2"> </metric>

        <metric name="L2 Miss (pti)" expression="(($L2Miss * 1000 / $IRPerfL22) + ($L2PFMissinL2 * 1000 / $IRPerfL2))"> </metric>
        <metric name="L2 Miss from IC Miss (pti)" expression="($L2MissIC * 1000 / $IRPerfL22)"> </metric>
        <metric name="L2 Miss from DC Miss (pti)" expression="($L2MissDC * 1000 / $IRPerfL22)"> </metric>
        <metric name="L2 Miss from L2 HWPF (pti)" expression="($L2PFMissinL2 * 1000 / $IRPerfL2)"> </metric>

        <metric name="L2 Hit (pti)" expression="(($L2HitWithoutPF * 1000 / $IRPerfL23) + ($L2PFHitinL2 * 1000 / $IRPerfL2))"> </metric>
        <metric name="L2 Hit from IC Miss (pti)" expression="($L2HitIC * 1000 / $IRPerfL23)"> </metric>
        <metric name="L2 Hit from DC Miss (pti)" expression="($L2HitDC * 1000 / $IRPerfL23)"> </metric>
        <metric name="L2 Hit from L2 HWPF (pti)" expression="($L2PFHitinL2 * 1000 / $IRPerfL2)"> </metric>
    </core>

    <core subtype="cache_miss">
        <event ctl="0x4300C0" name="$IRPerfCache"> </event>
        <event ctl="0x430864" name="$L2MissDCCache"> </event>
        <event ctl="0x431F71" name="$L2PFMissL2HitinL3Cache"> </event>
        <event ctl="0x431F72" name="$L2PFMissL2L3Cache"> </event>

        <metric name="$L2DataReadMiss" expression="($L2MissDCCache + $L2PFMissL2HitinL3Cache + $L2PFMissL2L3Cache)"> </metric>
    </core>

    <core subtype="cache_miss">
        <event ctl="0x4300C0" name="$IRPerfCache2"> </event>
        <event ctl="0x10043188E" name="$ICMissCache"> </event>
        <event ctl="0x43E860" name="$L2AccessFromDCMissCache"> </event>
        <event ctl="0x430164" name="$L2MissICCache"> </event>

        <metric name="L1 DC Miss (pti)" expression="($L2AccessFromDCMissCache * 1000) / $IRPerfCache2"> </metric>
        <metric name="L2 Data Read Miss (pti)" expression="($L2DataReadMiss * 1000 / $IRPerfCache)"> </metric>

        <metric name="L1 IC Miss (pti)" expression="($ICMissCache * 1000) / $IRPerfCache2"> </metric>
        <metric name="L2 Code Read Miss (pti)" expression="($L2MissICCache* 1000 / $IRPerfCache2)"> </metric>
    </core>

    <core subtype="tlb">
        <event ctl="0x4300C0" name="$IRPerfTLB"> </event>
        <event ctl="0x430084" name="$L1ItlbMissL2TlbHit"> </event>
        <event ctl="0x430785" name="$L1ItlbMissL2TlbMiss"> </event>
        <event ctl="0x43FF45" name="$L1DtlbMiss"> </event>
        <event ctl="0x43F045" name="$L2DtlbMiss"> </event>
    </core>

    <core subtype="tlb">
        <event ctl="0x4300C0" name="$IRPerfTLB2"> </event>
        <event ctl="0x43FF78" name="$TLBFlushes"> </event>

        <metric name="L1 ITLB Miss (pti)" expression="(($L1ItlbMissL2TlbHit + $L1ItlbMissL2TlbMiss) * 1000) / $IRPerfTLB"> </metric>
        <metric name="L2 ITLB Miss (pti)" expression="($L1ItlbMissL2TlbMiss * 1000) / $IRPerfTLB"> </metric>
        <metric name="L1 DTLB Miss (pti)" expression="($L1DtlbMiss * 1000) / $IRPerfTLB"> </metric>
        <metric name="L2 DTLB Miss (pti)" expression="($L2DtlbMiss * 1000) / $IRPerfTLB"> </metric>
        <metric name="All TLBs Flushed (pti)" expression="$TLBFlushes * 1000 / $IRPerfTLB2"> </metric>
    </core>

    <l3 subtype="l3">
        <event ctl="0x0300c0000040ff04" name="$L3Access"> </event>
        <event ctl="0x0300c00000400104" name="$L3Miss"> </event>
        <event ctl="0x0300c00000400090" name="$L3MissLatency"> </event>
        <event ctl="0x0300c00000401f9a" name="$L3MissByType"> </event>

        <metric name="L3 Access" expression="$L3Access"> </metric>
        <metric name="L3 Miss" expression="$L3Miss"> </metric>
        <metric name="L3 Access (pti)" expression="$L3Access * 1000 / $RetdInstL3" pti="T"> </metric>
        <metric name="L3 Miss (pti)" expression="$L3Miss * 1000 / $RetdInstL3" pti="T"> </metric>
        <metric name="L3 Miss %" expression="($L3Miss * 100) / $L3Access"> </metric>
        <metric name="Ave L3 Miss Latency" expression="($L3MissLatency * 16) / $L3MissByType"> </metric>
    </l3>

</event_configuration>
