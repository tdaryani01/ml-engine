name: Checkpoint blob safety

# The checkpoint blob loader is security-relevant (it must never run code from a blob): its tests run on every pull request and on main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install numpy pytest
      - run: python -m pytest -q testing/test_checkpoint_blob_safe.py
