# =====================================================================
# SYSTEM META CONFIGURATION
# =====================================================================
meta:
  pipeline_name: "industrial_risk_unconstrained_run"
  stage: "development"
  suppress_logging: false
  logging_level: "info"
  output_dir: "diagnostics_output"

# =====================================================================
# DATA INGESTION MATRIX
# =====================================================================
ingestion:
  source_mode: "csv"                # Hardcoded to disk mode for local CSV generation execution
  data_file_path: ".\\data\\samples\\csv\\prompt_security_dataset.csv"  # 🚨 Updated path to your generated file
  feature_names:                    # 🚨 Aligned perfectly with your text generator schema
    - "f1"
    - "f2"
    - "f3"
    - "f4"
    - "f5"
  splits:
    train: 0.70
    val: 0.15
  drain_on_empty: false
  amqp_url: "amqp://guest:guest@localhost:5672/%2f"   # Activated
  queue_name: "supply_chain.incoming_batches"         # Activated
  val_queue_name: "supply_chain.validation_batches"

# =====================================================================
# NETWORK ARCHITECTURE CONFIGURATION
# =====================================================================
architecture:
  model_type: "multi_class"
  num_classes: 3
  hidden_layers: [128, 64]
  p_dropout: 0.1                       # 🚨 Updated: Light dropout to balance feature sensitivity
  use_batch_norm: false                # Disabled: Stop shifting boundaries on crisp tabular formulas
  bn_momentum: 0.9

# =====================================================================
# OPTIMIZATION LOOP CONTROLS
# =====================================================================
optimization:
  optimizer: "adam"
  epochs_full_dataset: 500
  steps_streaming: 31
  batch_size: 64
  learning_rate: 0.001                 # 🚨 Updated: Standard rate to help Adam adapt to new L2 penalty
  
  # Learning Rate Schedule
  lr_scheduler: "none"
  scheduler_drop_ratio: 0.5
  scheduler_epochs_per_drop: 50        # Widened drop window to give Adam time to aggressively minimize loss
  scheduler_decay_rate: 0.98

  # Early Stopping Monitor
  early_stopping_enabled: true
  patience: 15                         # Extended patience to give the unconstrained network room to learn
  min_delta: 1.0e-05

  # Numerical Defensive Guardrails
  gradient_clipping_max_norm: 5.0

# =====================================================================
# REGULARIZATION STRAIN MATRIX
# =====================================================================
regularization:
  lam_l1: 0
  lam_l2: 0.001                        # 🚨 Updated: Added L2 penalty to suppress feature 0 dominance
  sparsity_tolerance: 1.0e-05          # Moved out of training block into its natural mathematical home

# =====================================================================
# PIPELINE FEATURE TRANSLATION TRANSFORMATIONS
# =====================================================================
transformations:
  fourier_expansion:
    enabled: false
    num_frequencies: 4

# =====================================================================
# PERSISTENCE & LIFECYCLE MANAGEMENT
# =====================================================================
persistence:
  load_saved_model: true               # 🚨 Kept unchanged
  model_asset_path: "deployed_model.npz"

# =====================================================================
# DIAGNOSTICS & REPORTING
# =====================================================================
diagnostics:
  enabled: true
  metric_to_plot: "all"
  save_raw_logs: true
  figure_width: 10
  figure_height: 6
  plot_style: "seaborn-v0_8-darkgrid"
  output_format: "png"