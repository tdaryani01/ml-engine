# Threading / pool policy (single source of truth for desktop, tests, Docker).
# num_threads <- config.yaml optimization.num_threads
#
# env:          shared across platforms
# linux:        GNU libgomp (Docker + Linux native conv)
# windows:      Intel OpenMP / MKL (PyTorch, NumPy wheels on Windows)
# im2col+gemm unified: USE_OPENMP=1 OpenBLAS shares libomp with conv_kernels (/openmp:llvm).
# Thread count: OMP_NUM_THREADS (not OPENBLAS_NUM_THREADS when USE_OPENMP=1). See OpenBLAS Makefile.
# Build: scripts/build_openblas.ps1 (USE_OPENMP=1 NUM_THREADS from config.yaml)
# numba pinned to 1 during fit for native / im2col+gemm.
# native + im2col+gemm: shared LLVM OMP pool (conv + bin/libopenblas); scipy wheel BLAS = 1.
# configure_native_threads() in conv_kernels.dll mirrors omp_during_fit (threadpoolctl
# does not reach the DLL's LLVM OpenMP).
# docker:       container benchmark paths only

env:
  OMP_DYNAMIC: "false"
  OMP_MAX_ACTIVE_LEVELS: "1"
  PYTHONUNBUFFERED: "1"
  ONEDNN_VERBOSE: "0"

linux:
  OMP_PROC_BIND: "false"
  OMP_WAIT_POLICY: "ACTIVE"
  GOMP_SPINCOUNT: "500000"

windows:
  KMP_BLOCKTIME: "5"
  KMP_AFFINITY: "none"
  KMP_DUPLICATE_LIB_OK: "TRUE"
  OMP_WAIT_POLICY: "ACTIVE"
  USE_OPENMP: "1"
blas_threads:
  native: null         # null -> use optimization.num_threads (shared OMP pool)
  numpy: null          # null -> use optimization.num_threads
  im2col_gemm: null    # null -> use optimization.num_threads (shared OMP pool)

docker:
  benchmark_runner:
    - python
    - -u
    - benchmarks/run_benchmarks_docker.py
  diagnostics_dir: benchmark_diagnostics
  results_file: benchmark_diagnostics/docker_benchmark_results.json
